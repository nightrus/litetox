name: litetox

services:
  mariadb:
    image: mariadb:11
    container_name: litetox-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: litetox
      MARIADB_USER: litetox
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./mariadb/data:/var/lib/mysql
      - ./mariadb/low-mem.cnf:/etc/mysql/conf.d/low-mem.cnf:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: &log
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  litetox:
    build: .
    image: litetox:2
    container_name: litetox
    restart: unless-stopped
    depends_on:
      mariadb: {condition: service_healthy}
    environment:
      LISTEN_TCP: "20013"
      LISTEN_HTTP: "20080"
      API_TOKEN: ${API_TOKEN}
      DATA_DIR: /app/data
      STATUS_POLL: ${STATUS_POLL:-600}
      USSD_POLL: ${USSD_POLL:-86400}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-30}
      DEFAULT_IMEI: ${DEFAULT_IMEI}
      ALTOX_UPSTREAM: ${ALTOX_UPSTREAM:-d2.altox.app:20332}
      DB_HOST: mariadb
      DB_USER: litetox
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: litetox
    ports:
      - "${TCP_PORT:-20013}:20013"   # modules (Wialon IPS), must be reachable from the internet
    volumes:
      - ./data:/app/data:rw
    mem_limit: 128m
    networks: [internal, web]   # HTTP API (:20080) is reachable only through the web network
    logging: *log

  # HTTPS for the API with an automatic Let's Encrypt certificate for ${DOMAIN}.
  # Already have a reverse proxy? Disable this service in docker-compose.override.yml and
  # attach your proxy to the web network (WEB_NETWORK) -> http://litetox:20080
  caddy:
    image: caddy:2-alpine
    container_name: litetox-caddy
    restart: unless-stopped
    depends_on: [litetox]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    mem_limit: 64m
    networks: [web]
    logging: *log

networks:
  internal: {}
  # named so that a reverse proxy from another compose project can join it as an external network
  web:
    name: ${WEB_NETWORK:-litetox-web}
